<footer class="footer">
  <span class="footer_item">{{ site.author.name }} &copy; {{ site.time | date: "%Y" }}</span>
  <small class="footer_copyright">
    RESEARCH & WRITEUPS
  </small>
</footer>

<div class="quick-search" id="quick-search" hidden>
  <div class="quick-search-overlay" data-qs-close></div>
  <div class="quick-search-modal" role="dialog" aria-modal="true" aria-label="Quick Search">
    <div class="quick-search-input-row">
      <input
        type="search"
        id="quick-search-input"
        class="quick-search-input"
        placeholder="Search posts..."
        autocomplete="off"
        spellcheck="false"
      />
      <button type="button" class="quick-search-close" data-qs-close aria-label="Close">ESC</button>
    </div>
    <div class="quick-search-status" id="quick-search-status"></div>
    <div class="quick-search-results" id="quick-search-results" role="list"></div>
  </div>
</div>

<script src="/assets/js/main.js" defer="defer"></script>

<!-- Gentle seasonal snow effect (always loaded, gated by config + user pref) -->
<script src="/assets/js/snow.js" defer data-enabled="{{ site.snow.enabled | default: false }}" data-months="{{ site.snow.months | join: ',' | default: '12' }}" data-density="{{ site.snow.density | default: 80 }}"></script>

{%- if page.google_analytics -%}
  <script src="/assets/js/galite.js"></script>
  <script>
    var galite = galite || {};
    galite.UA = "{{ site.google_analytics }}";
  </script>
{%- endif -%}
