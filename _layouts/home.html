layout: default
home: true
---

<div style="text-align: center; margin: 40px 0;">
  <h2 style="margin-bottom: 20px;">Welcome You All</h2>
  <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExYnM5cTVtNm9leWpxMGRpeG43YTR2dnc1cWE3MGFodmpxN21laTgwZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/2x0VePimPaFJDpGZ7H/giphy.gif" alt="Welcome" style="max-width: 100%; height: auto; border: none;">
</div>

<h3 class="posts-item-note" aria-label="Recent Posts">Recent Posts</h3>
{%- for post in site.posts limit: site.number_of_posts -%}
<article class="post-item">
  <span class="post-item-date">{{ post.date | date: "%b %d, %Y" }}</span>
  <h4 class="post-item-title">
    <a href="{{ post.url }}">{{ post.title | escape }}</a>
  </h4>
</article>
{%- endfor -%}
