---
layout: compress
---

<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: " en " }}">

{% include header.html %}

<body data-theme="default" class="notransition">

  <script>
    const body = document.body;
    const savedTheme = localStorage.getItem('siteTheme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const themeToApply = savedTheme || (prefersDark ? 'dark' : 'default');
    const savedFont = localStorage.getItem('siteFont') || 'JetBrains Mono';
    
    // Apply saved theme immediately
    body.setAttribute('data-theme', themeToApply);
    document.documentElement.setAttribute('data-theme', themeToApply);
    
    // Apply saved font globally with injected stylesheet
    const fontString = "'" + savedFont + "', monospace";
    const styleId = 'global-font-override';
    let styleTag = document.getElementById(styleId);
    
    if (!styleTag) {
      styleTag = document.createElement('style');
      styleTag.id = styleId;
      document.head.appendChild(styleTag);
    }
    
    styleTag.textContent = `
      * {
        font-family: ${fontString} !important;
      }
    `;
    
    setTimeout(() => body.classList.remove("notransition"), 75);
  </script>

  {% include navbar.html %}
  <div class="wrapper">
    <header class="header">
      <h1 class="header-title center" itemprop="headline">{{ page.title | escape }}</h1>
    </header>
    <main class="page-content" aria-label="Content">
      {% include anchor_headings.html html=content anchorClass="anchor-head" beforeHeading=true h_min=4 h_max=4 %}
    </main>
    {% include footer.html %}
  </div>
</body>

</html>
